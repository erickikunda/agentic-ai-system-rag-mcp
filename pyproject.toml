[project]
name = "genai-lab"
version = "0.1.0"
description = "Production-realistic GenAI engineering lab for RAG, agents, memory, orchestration, and MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langchain>=1.1",
  "langchain-core>=0.3",
  "llama-index-core>=0.12",
  "llama-index-embeddings-ollama>=0.5",
  "llama-index-embeddings-openai>=0.3",
  "llama-index-readers-file>=0.4",
  "llama-index-vector-stores-postgres>=0.4",
  "mcp>=1.20",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
]

[project.scripts]
genai-lab-api = "genai_lab.api.app:main"
genai-lab-ingest = "genai_lab.ingestion.cli:main"
genai-lab-rag = "genai_lab.rag.cli:main"
genai-lab-agent = "genai_lab.agents.cli:main"
genai-lab-workflow = "genai_lab.workflows.cli:main"
genai-lab-memory = "genai_lab.memory.cli:main"
genai-lab-mcp = "genai_lab.mcp.cli:main"
genai-lab-eval = "genai_lab.evaluation.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
