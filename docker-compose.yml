name: genai-lab

services:
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      mcp-server:
        condition: service_started
    volumes:
      - .:/workspace

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: genai_lab
      POSTGRES_PASSWORD: genai_lab
      POSTGRES_DB: genai_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai_lab -d genai_lab"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  mcp-server:
    profiles: ["mcp"]
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  ollama-data:
